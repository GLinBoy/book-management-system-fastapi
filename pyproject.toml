[project]
name = "book-management-system-fastapi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "faker>=40.54.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-fail-under=95"

[tool.mypy]
python_version = "3.14"
files = ["app"]
strict = true
warn_unreachable = true
show_error_codes = true
# SQLAlchemy 2.x models are typed natively; only pydantic needs a plugin.
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
