name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.14"
          # Caching is added with the caching and branch-protection work.
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  test:
    name: Test (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            test_database_url: "sqlite://"
          - database: postgres
            test_database_url: "postgresql+psycopg://books:books@127.0.0.1:5432/books_test"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: books_test
          POSTGRES_USER: books
          POSTGRES_PASSWORD: books
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U books -d books_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.test_database_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.database }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

