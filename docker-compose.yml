# Production-like stack. Docker Compose also loads docker-compose.override.yml
# by default; run this file alone to bypass the development override:
#
#   docker compose -f docker-compose.yml up --build
#
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: book-management-system-fastapi:prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-books}
      POSTGRES_USER: ${POSTGRES_USER:-books}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    expose:
      - "5432"

volumes:
  postgres_data:
